name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build application
        run: ./gradlew build --no-daemon

      - name: Set up SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/kw-space.pem
          chmod 600 ~/.ssh/kw-space.pem
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload boot jar
        shell: bash
        run: |
          scp -P "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            build/libs/KW-SPACE-0.0.1-SNAPSHOT.jar \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${EC2_APP_DIR}/build/libs/KW-SPACE-0.0.1-SNAPSHOT.jar"

      - name: Restart application
        shell: bash
        run: |
          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "sudo systemctl restart kw-space && sudo systemctl status kw-space --no-pager"
