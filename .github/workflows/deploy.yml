name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build application
        run: ./gradlew build --no-daemon

      - name: Build Docker image
        run: |
          docker build \
            --tag kw-space:${{ github.sha }} \
            --tag kw-space:latest \
            .
          docker save kw-space:${{ github.sha }} | gzip > kw-space-image.tar.gz

      - name: Set up SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/kw-space.pem
          chmod 600 ~/.ssh/kw-space.pem
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload Docker image
        shell: bash
        run: |
          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p \"${EC2_APP_DIR}\""
          scp -P "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            kw-space-image.tar.gz \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${EC2_APP_DIR}/kw-space-image.tar.gz"

      - name: Restart Docker container
        shell: bash
        run: |
          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "EC2_APP_DIR='${EC2_APP_DIR}' IMAGE_TAG='kw-space:${{ github.sha }}' bash -s" <<'EOF'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the EC2 host."
            exit 1
          fi

          if [ ! -f "${EC2_APP_DIR}/.env" ]; then
            echo "Missing ${EC2_APP_DIR}/.env on the EC2 host."
            exit 1
          fi

          SPRING_PROFILE="$(
            grep -E '^(SPRING_PROFILES_ACTIVE|spring.profiles.active)=' "${EC2_APP_DIR}/.env" \
              | tail -n 1 \
              | cut -d= -f2- \
              || true
          )"
          SPRING_PROFILE="${SPRING_PROFILE:-local}"
          DOCKER_ENV_FILE="${EC2_APP_DIR}/.docker.env"
          grep -v -E '^(SPRING_PROFILES_ACTIVE|spring.profiles.active)=' "${EC2_APP_DIR}/.env" > "${DOCKER_ENV_FILE}" || true
          printf 'SPRING_PROFILES_ACTIVE=%s\n' "${SPRING_PROFILE}" >> "${DOCKER_ENV_FILE}"

          gunzip -c "${EC2_APP_DIR}/kw-space-image.tar.gz" | sudo docker load
          sudo docker stop kw-space || true
          sudo docker rm kw-space || true
          sudo docker run -d \
            --name kw-space \
            --restart unless-stopped \
            --env-file "${DOCKER_ENV_FILE}" \
            -p 8080:8080 \
            "${IMAGE_TAG}"

          sleep 10
          if ! curl --fail --silent --show-error http://localhost:8080/api/health; then
            sudo docker logs --tail 200 kw-space
            exit 1
          fi
          sudo docker ps --filter name=kw-space
          sudo docker image prune --force
          EOF
