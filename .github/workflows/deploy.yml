name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build application
        run: ./gradlew build --no-daemon

      - name: Build Docker image
        run: |
          docker build \
            --tag kw-space:${{ github.sha }} \
            --tag kw-space:latest \
            .
          docker save kw-space:${{ github.sha }} | gzip > kw-space-image.tar.gz

      - name: Create deployment env file
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.KW_SPACE_AUTH_JWT_SECRET }}
          JWT_ACCESS_TOKEN_TTL: ${{ secrets.KW_SPACE_AUTH_JWT_ACCESS_TOKEN_TTL }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for name in JWT_SECRET DB_URL DB_USERNAME DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}"
              exit 1
            fi
          done

          for name in JWT_SECRET JWT_ACCESS_TOKEN_TTL DB_URL DB_USERNAME DB_PASSWORD; do
            value="${!name-}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "Secret ${name} must be a single line for Docker env-file format."
              exit 1
            fi
          done

          umask 077
          {
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'KW_SPACE_AUTH_JWT_SECRET=%s\n' "${JWT_SECRET}"
            printf 'KW_SPACE_AUTH_JWT_ACCESS_TOKEN_TTL=%s\n' "${JWT_ACCESS_TOKEN_TTL:-1h}"
            printf 'DB_URL=%s\n' "${DB_URL}"
            printf 'DB_USERNAME=%s\n' "${DB_USERNAME}"
            printf 'DB_PASSWORD=%s\n' "${DB_PASSWORD}"
          } > deploy.env

      - name: Set up SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/kw-space.pem
          chmod 600 ~/.ssh/kw-space.pem
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload Docker image and env file
        shell: bash
        run: |
          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p \"${EC2_APP_DIR}\""
          scp -P "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            kw-space-image.tar.gz \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${EC2_APP_DIR}/kw-space-image.tar.gz"
          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "rm -f \"${EC2_APP_DIR}/.env.tmp\" && umask 077 && cat > \"${EC2_APP_DIR}/.env.tmp\" && mv -f \"${EC2_APP_DIR}/.env.tmp\" \"${EC2_APP_DIR}/.env\"" < deploy.env

      - name: Restart Docker container
        shell: bash
        run: |
          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/kw-space.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "EC2_APP_DIR='${EC2_APP_DIR}' IMAGE_TAG='kw-space:${{ github.sha }}' bash -s" <<'EOF'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the EC2 host."
            exit 1
          fi

          if [ ! -f "${EC2_APP_DIR}/.env" ]; then
            echo "Missing ${EC2_APP_DIR}/.env on the EC2 host."
            exit 1
          fi

          SPRING_PROFILE="$(
            grep -E '^(SPRING_PROFILES_ACTIVE|spring.profiles.active)=' "${EC2_APP_DIR}/.env" \
              | tail -n 1 \
              | cut -d= -f2- \
              || true
          )"
          if [ -z "${SPRING_PROFILE}" ]; then
            echo "Missing spring profile in ${EC2_APP_DIR}/.env."
            echo "Set SPRING_PROFILES_ACTIVE=prod or spring.profiles.active=prod."
            exit 1
          fi
          if [ "${SPRING_PROFILE}" != "prod" ]; then
            echo "Production deployment requires SPRING_PROFILES_ACTIVE=prod."
            exit 1
          fi

          DOCKER_ENV_FILE="${EC2_APP_DIR}/.docker.env"
          install -m 600 /dev/null "${DOCKER_ENV_FILE}"
          grep -v -E '^(SPRING_PROFILES_ACTIVE|spring.profiles.active)=' "${EC2_APP_DIR}/.env" > "${DOCKER_ENV_FILE}" || true
          printf 'SPRING_PROFILES_ACTIVE=%s\n' "${SPRING_PROFILE}" >> "${DOCKER_ENV_FILE}"

          gunzip -c "${EC2_APP_DIR}/kw-space-image.tar.gz" | sudo docker load
          sudo docker rm -f kw-space-next || true
          sudo docker rm -f kw-space-rollback || true

          sudo docker run -d \
            --name kw-space-next \
            --env-file "${DOCKER_ENV_FILE}" \
            -p 18080:8080 \
            "${IMAGE_TAG}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:18080/api/health; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              sudo docker logs --tail 200 kw-space-next
              sudo docker rm -f kw-space-next
              exit 1
            fi
            sleep 2
          done

          if sudo docker inspect kw-space >/dev/null 2>&1; then
            sudo docker rename kw-space kw-space-rollback
            sudo docker stop kw-space-rollback
          fi

          if ! sudo docker run -d \
              --name kw-space \
              --restart unless-stopped \
              --env-file "${DOCKER_ENV_FILE}" \
              -p 8080:8080 \
              "${IMAGE_TAG}"; then
            if sudo docker inspect kw-space-rollback >/dev/null 2>&1; then
              sudo docker start kw-space-rollback
              sudo docker rename kw-space-rollback kw-space
            fi
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/api/health; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              sudo docker logs --tail 200 kw-space
              sudo docker rm -f kw-space
              if sudo docker inspect kw-space-rollback >/dev/null 2>&1; then
                sudo docker start kw-space-rollback
                sudo docker rename kw-space-rollback kw-space
              fi
              exit 1
            fi
            sleep 2
          done

          if sudo docker inspect kw-space-rollback >/dev/null 2>&1; then
            sudo docker rm -f kw-space-rollback
          fi

          sudo docker rm -f kw-space-next
          sudo docker ps --filter name=kw-space
          sudo docker images kw-space --format '{{.Repository}}:{{.Tag}}' \
            | grep -v -F "${IMAGE_TAG}" \
            | grep -v -F 'kw-space:latest' \
            | xargs -r sudo docker rmi || true
          EOF
