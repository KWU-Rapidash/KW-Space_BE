name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kwu-rapidash/kw-space-be

jobs:
  build:
    name: Build ARM64 image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build application
        run: ./gradlew build --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy with Docker Compose
    needs: build
    runs-on: [self-hosted, Linux, ARM64, kw-space, rpi4]
    environment: production
    env:
      APP_DIR: /home/ubuntu/apps/kw-space

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Create deployment environment
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.KW_SPACE_AUTH_JWT_SECRET }}
          JWT_ACCESS_TOKEN_TTL: ${{ secrets.KW_SPACE_AUTH_JWT_ACCESS_TOKEN_TTL }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for name in JWT_SECRET DB_URL DB_USERNAME DB_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}"
              exit 1
            fi
          done

          for name in JWT_SECRET JWT_ACCESS_TOKEN_TTL DB_URL DB_USERNAME DB_PASSWORD; do
            value="${!name-}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "Secret ${name} must be a single line for Docker env-file format."
              exit 1
            fi
          done

          umask 077
          {
            printf 'IMAGE_TAG=%s\n' "${GITHUB_SHA}"
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'KW_SPACE_AUTH_JWT_SECRET=%s\n' "${JWT_SECRET}"
            printf 'KW_SPACE_AUTH_JWT_ACCESS_TOKEN_TTL=%s\n' "${JWT_ACCESS_TOKEN_TTL:-1h}"
            printf 'DB_URL=%s\n' "${DB_URL}"
            printf 'DB_USERNAME=%s\n' "${DB_USERNAME}"
            printf 'DB_PASSWORD=%s\n' "${DB_PASSWORD}"
          } > "${RUNNER_TEMP}/kw-space.env"

      - name: Install deployment files
        shell: bash
        run: |
          install -d -m 700 "${APP_DIR}"
          install -m 644 deploy/docker-compose.yml "${APP_DIR}/docker-compose.yml"
          install -m 700 deploy/deploy.sh "${APP_DIR}/deploy.sh"
          install -m 600 "${RUNNER_TEMP}/kw-space.env" "${APP_DIR}/.env.next"

      - name: Pull and deploy image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          cd "${APP_DIR}"
          ./deploy.sh

      - name: Verify public health endpoint
        run: curl --fail --silent --show-error https://kw-space.leehyowon14.dev/api/health
