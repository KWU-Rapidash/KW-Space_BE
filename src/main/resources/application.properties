spring.application.name=KW-SPACE
spring.config.import=optional:file:.env[.properties]
kw-space.auth.jwt.secret=${KW_SPACE_AUTH_JWT_SECRET:}
kw-space.auth.jwt.access-token-ttl=${KW_SPACE_AUTH_JWT_ACCESS_TOKEN_TTL:1h}
kw-space.auth.cookie.access-token-name=accessToken
kw-space.auth.cookie.secure=true
kw-space.auth.cookie.http-only=true
kw-space.auth.cookie.same-site=Lax
kw-space.auth.cookie.path=/
kw-space.auth.cookie.max-age=3600s

# Database credentials are supplied through environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
