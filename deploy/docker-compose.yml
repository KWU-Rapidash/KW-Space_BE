name: kw-space

services:
  api:
    image: ghcr.io/kwu-rapidash/kw-space-be:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: kw-space-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3002:8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
